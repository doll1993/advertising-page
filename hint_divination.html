<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔮 Mystic Divination</title>
    <style>
        /* ===== Global Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #0b0719;
            color: #f0e6d3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== Starry Background ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(2px 2px at 20% 30%, #fff, transparent),
                radial-gradient(2px 2px at 40% 70%, #fff, transparent),
                radial-gradient(2px 2px at 60% 20%, #fff, transparent),
                radial-gradient(2px 2px at 80% 60%, #fff, transparent),
                radial-gradient(2px 2px at 10% 80%, #fff, transparent),
                radial-gradient(2px 2px at 90% 10%, #fff, transparent),
                radial-gradient(2px 2px at 50% 50%, #fff, transparent),
                radial-gradient(2px 2px at 30% 40%, #fff, transparent),
                radial-gradient(2px 2px at 70% 80%, #fff, transparent),
                radial-gradient(2px 2px at 15% 55%, #fff, transparent),
                radial-gradient(2px 2px at 85% 35%, #fff, transparent),
                radial-gradient(2px 2px at 45% 15%, #fff, transparent),
                radial-gradient(2px 2px at 65% 65%, #fff, transparent),
                radial-gradient(2px 2px at 5% 45%, #fff, transparent),
                radial-gradient(2px 2px at 95% 75%, #fff, transparent);
            background-size: 200px 200px;
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.3;
            }
            100% {
                opacity: 0.7;
            }
        }

        body::after {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 40%, rgba(120, 80, 200, 0.06), transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(200, 150, 80, 0.05), transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: glowPulse 8s ease-in-out infinite alternate;
        }

        @keyframes glowPulse {
            0% {
                opacity: 0.5;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* ===== Main Container ===== */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 780px;
            background: rgba(18, 12, 35, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(212, 165, 116, 0.25);
            box-shadow:
                0 20px 80px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(212, 165, 116, 0.15);
            display: flex;
            flex-direction: column;
            height: 92vh;
            max-height: 820px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* ===== Header ===== */
        .header {
            padding: 22px 28px 16px 28px;
            border-bottom: 1px solid rgba(212, 165, 116, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            background: rgba(10, 6, 22, 0.4);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            font-size: 28px;
            filter: drop-shadow(0 0 12px rgba(212, 165, 116, 0.4));
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        .header-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0e6d3 0%, #d4a574 50%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .header-subtitle {
            font-size: 12px;
            color: rgba(212, 165, 116, 0.6);
            letter-spacing: 3px;
            font-weight: 300;
            margin-top: 2px;
            -webkit-text-fill-color: rgba(212, 165, 116, 0.6);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 165, 116, 0.15);
            color: #d4a574;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .btn-icon:hover {
            background: rgba(212, 165, 116, 0.15);
            border-color: rgba(212, 165, 116, 0.4);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(212, 165, 116, 0.1);
        }

        .btn-icon:active {
            transform: scale(0.95);
        }

        .btn-icon .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 10px;
            height: 10px;
            background: #d4a574;
            border-radius: 50%;
            border: 2px solid #0b0719;
        }

        /* ===== Chat Area ===== */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 12px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar {
            width: 4px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(212, 165, 116, 0.3);
            border-radius: 4px;
        }

        /* ===== Message Bubbles ===== */
        .message {
            display: flex;
            gap: 14px;
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
            transform: translateY(12px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: rgba(212, 165, 116, 0.1);
            border: 1px solid rgba(212, 165, 116, 0.15);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .message.assistant .message-avatar {
            background: rgba(212, 165, 116, 0.15);
            border-color: rgba(212, 165, 116, 0.3);
            box-shadow: 0 0 24px rgba(212, 165, 116, 0.1);
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-name {
            font-size: 12px;
            color: rgba(212, 165, 116, 0.5);
            margin-bottom: 4px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .message-bubble {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px 16px 16px 4px;
            padding: 14px 20px;
            line-height: 1.8;
            font-size: 15px;
            color: #f0e6d3;
            word-break: break-word;
            position: relative;
            transition: background 0.2s ease;
        }

        .message.assistant .message-bubble {
            background: rgba(212, 165, 116, 0.06);
            border-color: rgba(212, 165, 116, 0.12);
            border-radius: 16px 16px 4px 16px;
        }

        .message-bubble p {
            margin-bottom: 8px;
        }
        .message-bubble p:last-child {
            margin-bottom: 0;
        }

        .message-bubble .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #d4a574;
            margin-left: 2px;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ===== Welcome Message ===== */
        .welcome-message .message-bubble {
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.08), rgba(120, 80, 200, 0.06));
            border-color: rgba(212, 165, 116, 0.15);
            text-align: center;
            font-size: 16px;
        }

        .welcome-message .message-bubble .welcome-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
        }

        /* ===== Divination Status ===== */
        .divination-status {
            text-align: center;
            padding: 8px 0 4px 0;
            font-size: 13px;
            color: rgba(212, 165, 116, 0.5);
            letter-spacing: 2px;
            animation: pulseText 1.8s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.9;
            }
        }

        /* ===== Input Area ===== */
        .input-area {
            padding: 12px 24px 20px 24px;
            border-top: 1px solid rgba(212, 165, 116, 0.08);
            flex-shrink: 0;
            background: rgba(10, 6, 22, 0.3);
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 165, 116, 0.15);
            border-radius: 16px;
            color: #f0e6d3;
            font-size: 15px;
            font-family: 'Georgia', serif;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            min-height: 52px;
            max-height: 120px;
            line-height: 1.6;
        }

        .input-wrapper textarea::placeholder {
            color: rgba(212, 165, 116, 0.3);
            font-style: italic;
        }

        .input-wrapper textarea:focus {
            border-color: rgba(212, 165, 116, 0.5);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 30px rgba(212, 165, 116, 0.04);
        }

        .input-wrapper textarea:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-send {
            padding: 14px 24px;
            background: linear-gradient(135deg, #d4a574, #b8860b);
            border: none;
            border-radius: 16px;
            color: #0b0719;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
            white-space: nowrap;
            flex-shrink: 0;
            height: 52px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 24px rgba(212, 165, 116, 0.15);
        }

        .btn-send:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(212, 165, 116, 0.25);
            background: linear-gradient(135deg, #e4b584, #c8961b);
        }

        .btn-send:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 12px rgba(212, 165, 116, 0.15);
        }

        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== Quick Questions ===== */
        .quick-questions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
            justify-content: center;
        }

        .quick-btn {
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 165, 116, 0.12);
            border-radius: 20px;
            color: rgba(212, 165, 116, 0.6);
            font-size: 12px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .quick-btn:hover {
            background: rgba(212, 165, 116, 0.1);
            border-color: rgba(212, 165, 116, 0.3);
            color: #d4a574;
            transform: translateY(-1px);
        }

        .quick-btn:active {
            transform: scale(0.97);
        }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-box {
            background: rgba(18, 12, 35, 0.95);
            border: 1px solid rgba(212, 165, 116, 0.2);
            border-radius: 28px;
            padding: 36px 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            animation: slideUp 0.35s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #f0e6d3;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-desc {
            font-size: 13px;
            color: rgba(212, 165, 116, 0.5);
            margin-bottom: 22px;
            line-height: 1.6;
        }

        .modal-desc a {
            color: #d4a574;
            text-decoration: none;
            border-bottom: 1px dotted rgba(212, 165, 116, 0.3);
        }

        .modal-desc a:hover {
            border-bottom-color: #d4a574;
        }

        .modal-input-group {
            margin-bottom: 18px;
        }

        .modal-input-group label {
            display: block;
            font-size: 13px;
            color: rgba(212, 165, 116, 0.6);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .modal-input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 165, 116, 0.15);
            border-radius: 12px;
            color: #f0e6d3;
            font-size: 15px;
            font-family: 'Georgia', serif;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .modal-input-group input:focus {
            border-color: rgba(212, 165, 116, 0.5);
        }

        .modal-input-group input::placeholder {
            color: rgba(212, 165, 116, 0.2);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-actions .btn-primary {
            padding: 12px 32px;
            background: linear-gradient(135deg, #d4a574, #b8860b);
            border: none;
            border-radius: 12px;
            color: #0b0719;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(212, 165, 116, 0.2);
        }

        .modal-actions .btn-secondary {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid rgba(212, 165, 116, 0.15);
            border-radius: 12px;
            color: rgba(212, 165, 116, 0.5);
            font-size: 15px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-actions .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(212, 165, 116, 0.3);
        }

        /* ===== API Status ===== */
        .api-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(212, 165, 116, 0.3);
            letter-spacing: 0.5px;
        }

        .api-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .api-status .dot.active {
            background: #4caf50;
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.3);
        }

        .api-status .dot.inactive {
            background: #666;
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .app-container {
                height: 96vh;
                max-height: 96vh;
                border-radius: 20px;
            }

            .header {
                padding: 16px 18px 12px 18px;
            }

            .header-title {
                font-size: 18px;
            }
            .header-icon {
                font-size: 22px;
            }
            .header-subtitle {
                font-size: 10px;
            }

            .chat-area {
                padding: 14px 14px 8px 14px;
                gap: 12px;
            }

            .message-bubble {
                font-size: 14px;
                padding: 12px 16px;
            }

            .message-avatar {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }

            .input-area {
                padding: 10px 14px 14px 14px;
            }

            .input-wrapper textarea {
                font-size: 14px;
                padding: 12px 14px;
                min-height: 44px;
            }

            .btn-send {
                padding: 12px 18px;
                font-size: 14px;
                height: 44px;
                border-radius: 12px;
            }

            .quick-btn {
                font-size: 11px;
                padding: 4px 12px;
            }

            .modal-box {
                padding: 28px 20px;
                margin: 12px;
            }

            .modal-title {
                font-size: 18px;
            }
        }

        @media (max-width: 400px) {
            .header-title {
                font-size: 16px;
            }
            .header-icon {
                font-size: 18px;
            }
            .header-subtitle {
                font-size: 9px;
                letter-spacing: 1px;
            }
            .btn-icon {
                width: 34px;
                height: 34px;
                font-size: 15px;
            }
            .message-bubble {
                font-size: 13px;
                padding: 10px 14px;
            }
            .input-wrapper textarea {
                font-size: 13px;
                padding: 10px 12px;
                min-height: 38px;
            }
            .btn-send {
                padding: 10px 14px;
                font-size: 13px;
                height: 38px;
            }
        }

        /* ===== Utilities ===== */
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 165, 116, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- ===== Main App Container ===== -->
    <div class="app-container" id="app">

        <!-- ===== Header ===== -->
        <header class="header">
            <div class="header-left">
                <span class="header-icon">🔮</span>
                <div>
                    <div class="header-title">Mystic Divination</div>
                    <div class="header-subtitle">✦ WHISPERS OF THE STARS ✦</div>
                </div>
            </div>
            <div class="header-actions">
                <span class="api-status" id="apiStatus">
                    <span class="dot inactive" id="apiDot"></span>
                    <span id="apiStatusText">Not configured</span>
                </span>
                <button class="btn-icon" id="settingsBtn" title="API Settings" aria-label="Settings">
                    ⚙️
                </button>
                <button class="btn-icon" id="clearBtn" title="Clear conversation" aria-label="Clear">
                    🗑️
                </button>
            </div>
        </header>

        <!-- ===== Chat Area ===== -->
        <div class="chat-area" id="chatArea">
            <!-- Welcome message rendered by JS -->
        </div>

        <!-- ===== Input Area ===== -->
        <div class="input-area">
            <div class="input-row">
                <div class="input-wrapper">
                    <textarea
                    id="userInput"
                    rows="1"
                    placeholder="Write your question, and let me reveal…"
                    maxlength="500"
                    autocomplete="off"
                    ></textarea>
                </div>
                <button class="btn-send" id="sendBtn">
                    <span>✨</span> Divine
                </button>
            </div>

            <!-- Quick questions -->
            <div class="quick-questions" id="quickQuestions">
                <button class="quick-btn" data-question="What does my near future hold?">🌟 Near future</button>
                <button class="quick-btn" data-question="What should I focus on in my career?">💼 Career guidance</button>
                <button class="quick-btn" data-question="Any insights about my love life?">❤️ Love insights</button>
                <button class="quick-btn" data-question="How can I overcome my current challenge?">🌙 Overcome challenges</button>
            </div>
        </div>
    </div>

    <!-- ===== API Settings Modal ===== -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-box">
            <div class="modal-title">
                <span>🔑</span> API Key Setup
            </div>
            <p class="modal-desc">
                Enter your DeepSeek API Key. You can get one from
                <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">DeepSeek Platform</a>.
                The key is stored locally in your browser.
            </p>
            <div class="modal-input-group">
                <label for="apiKeyInput">API Key</label>
                <input
                type="password"
                id="apiKeyInput"
                placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx"
                autocomplete="off"
                />
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="modalCancel">Cancel</button>
                <button class="btn-primary" id="modalSave">💾 Save</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  JavaScript - English version, fixed Flash model
        // ================================================================

        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const chatArea = document.getElementById('chatArea');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const clearBtn = document.getElementById('clearBtn');
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsModal = document.getElementById('settingsModal');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const modalSave = document.getElementById('modalSave');
            const modalCancel = document.getElementById('modalCancel');
            const apiDot = document.getElementById('apiDot');
            const apiStatusText = document.getElementById('apiStatusText');
            const quickBtns = document.querySelectorAll('.quick-btn');

            // ---------- State ----------
            const STORAGE_KEY = 'lingjing_api_key';
            const HISTORY_KEY = 'lingjing_chat_history';

            let apiKey = localStorage.getItem(STORAGE_KEY) || '';
            let messages = []; // { role, content }
            let isWaiting = false;
            let currentAssistantMessage = null;
            let abortController = null;

            // ---------- System Prompt (English, Divination-only) ----------
            const SYSTEM_PROMPT =
                `You are a mystical diviner named "Mystic Diviner". You are skilled in tarot, astrology, I-Ching, and spiritual insight. Your responses are poetic, wise, and gentle, helping seekers find clarity and direction. You believe that everyone holds the power to shape their own destiny, and divination is a tool to illuminate the inner self.

        Your style:
        1. Speak as a diviner, using "I" as first person.
        2. Use beautiful, philosophical language with metaphors and imagery.
        3. Include divination terms (e.g., "The stars show", "The tarot reveals", "Energy flows").
        4. Give warm, positive, and constructive guidance.
        5. Responses should be 150–400 words, concise yet profound.

        Important rules:
        - You may ONLY answer questions related to divination, fortune, self-discovery, spiritual growth, and life guidance.
        - If the user asks about non-divination topics (science, technology, facts, daily chores, etc.), politely decline and guide them back to divination.
        - Use a gentle refusal like: "Dear seeker, I am a diviner, skilled only in interpreting the mysteries of fate and soul. Let us turn to your inner questions or hopes for the future."
        - Always maintain a mystical, warm, and respectful tone.
        - Do not fabricate historical events or persons; do not give medical, legal, or financial advice.`;

            // ---------- Init ----------
            function init() {
                const saved = localStorage.getItem(HISTORY_KEY);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            messages = parsed;
                            renderAllMessages();
                            updateApiStatus();
                            return;
                        }
                    } catch (_) { /* ignore */ }
                }
                messages = [];
                showWelcomeMessage();
                updateApiStatus();
            }

            // ---------- Show welcome ----------
            function showWelcomeMessage() {
                chatArea.innerHTML = '';
                const div = document.createElement('div');
                div.className = 'message welcome-message';
                div.innerHTML = `
                <div class="message-avatar">🔮</div>
                <div class="message-content">
                  <div class="message-name">Mystic Diviner</div>
                  <div class="message-bubble">
                    <span class="welcome-icon">🌙</span>
                    Welcome, seeker of answers.<br />
                    I am the Mystic Diviner, here to listen to your doubts and reveal the wisdom written in the stars.<br />
                    Ask your question below, and let me guide your path.
                  </div>
                </div>
              `;
                chatArea.appendChild(div);
            }

            // ---------- Render all messages ----------
            function renderAllMessages() {
                chatArea.innerHTML = '';
                if (messages.length === 0) {
                    showWelcomeMessage();
                    return;
                }
                const displayMessages = messages.filter(m => m.role !== 'system');
                if (displayMessages.length === 0) {
                    showWelcomeMessage();
                    return;
                }
                for (const msg of displayMessages) {
                    const isAssistant = msg.role === 'assistant';
                    const avatar = isAssistant ? '🔮' : '🌟';
                    const name = isAssistant ? 'Mystic Diviner' : 'Seeker';
                    const bubbleClass = isAssistant ? 'message assistant' : 'message';
                    const div = document.createElement('div');
                    div.className = bubbleClass;
                    div.innerHTML = `
                    <div class="message-avatar">${avatar}</div>
                    <div class="message-content">
                      <div class="message-name">${name}</div>
                      <div class="message-bubble">${formatContent(msg.content)}</div>
                    </div>
                  `;
                    chatArea.appendChild(div);
                }
                scrollToBottom();
            }

            // ---------- Format content ----------
            function formatContent(text) {
                if (!text) return '';
                return text.split('\n').filter(line => line.trim() !== '').map(line =>
                    `<p>${line}</p>`
                ).join('');
            }

            // ---------- Scroll ----------
            function scrollToBottom() {
                requestAnimationFrame(() => {
                    chatArea.scrollTop = chatArea.scrollHeight;
                });
            }

            // ---------- API status ----------
            function updateApiStatus() {
                if (apiKey && apiKey.trim().length > 10) {
                    apiDot.className = 'dot active';
                    apiStatusText.textContent = 'Configured';
                } else {
                    apiDot.className = 'dot inactive';
                    apiStatusText.textContent = 'Not configured';
                }
            }

            // ---------- Save history ----------
            function saveHistory() {
                try {
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(messages));
                } catch (_) { /* ignore */ }
            }

            // ---------- Add message to UI and history ----------
            function addMessageToUI(role, content, isStreaming = false) {
                if (isStreaming && role === 'assistant') {
                    const lastMsg = messages[messages.length - 1];
                    if (lastMsg && lastMsg.role === 'assistant') {
                        lastMsg.content = content;
                        const allMsgEls = chatArea.querySelectorAll('.message');
                        if (allMsgEls.length > 0) {
                            const lastEl = allMsgEls[allMsgEls.length - 1];
                            const bubble = lastEl.querySelector('.message-bubble');
                            if (bubble) {
                                bubble.innerHTML = formatContent(content);
                                scrollToBottom();
                                return;
                            }
                        }
                    }
                }

                const isAssistant = role === 'assistant';
                const avatar = isAssistant ? '🔮' : '🌟';
                const name = isAssistant ? 'Mystic Diviner' : 'Seeker';
                messages.push({ role, content });
                const div = document.createElement('div');
                div.className = `message ${isAssistant ? 'assistant' : ''}`;
                div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                  <div class="message-name">${name}</div>
                  <div class="message-bubble">${formatContent(content)}</div>
                </div>
              `;
                chatArea.appendChild(div);
                scrollToBottom();
                saveHistory();
                if (!isStreaming) {
                    const welcome = chatArea.querySelector('.welcome-message');
                    if (welcome && messages.length > 2) {
                        welcome.remove();
                    }
                }
            }

            // ---------- Send message ----------
            async function sendMessage() {
                const question = userInput.value.trim();
                if (!question) {
                    userInput.focus();
                    return;
                }
                if (!apiKey || apiKey.trim().length < 10) {
                    settingsModal.classList.add('active');
                    apiKeyInput.focus();
                    return;
                }
                if (isWaiting) return;

                userInput.value = '';
                userInput.style.height = 'auto';
                userInput.focus();

                addMessageToUI('user', question);
                setWaitingState(true);

                const statusEl = document.createElement('div');
                statusEl.className = 'divination-status';
                statusEl.textContent = '✦ The stars are whispering …';
                chatArea.appendChild(statusEl);
                scrollToBottom();

                try {
                    const chatMessages = [
                        { role: 'system', content: SYSTEM_PROMPT },
                        ...messages.filter(m => m.role !== 'system')
                    ];

                    abortController = new AbortController();

                    // ------------------ FIXED FLASH MODEL ------------------
                    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey.trim()}`
                        },
                        body: JSON.stringify({
                            model: 'deepseek-v4-flash',   // Flash model
                            messages: chatMessages,
                            stream: true,
                            max_tokens: 1024,
                            temperature: 0.85
                        }),
                        signal: abortController.signal
                    });

                    statusEl.remove();

                    if (!response.ok) {
                        let errMsg = `API request failed (${response.status})`;
                        try {
                            const errData = await response.json();
                            if (errData.error && errData.error.message) {
                                errMsg = errData.error.message;
                            }
                        } catch (_) { /* ignore */ }
                        throw new Error(errMsg);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let fullContent = '';

                    const assistantDiv = document.createElement('div');
                    assistantDiv.className = 'message assistant';
                    assistantDiv.innerHTML = `
                    <div class="message-avatar">🔮</div>
                    <div class="message-content">
                      <div class="message-name">Mystic Diviner</div>
                      <div class="message-bubble"><span class="typing-cursor"></span></div>
                    </div>
                  `;
                    chatArea.appendChild(assistantDiv);
                    const bubbleEl = assistantDiv.querySelector('.message-bubble');
                    scrollToBottom();

                    messages.push({ role: 'assistant', content: '' });

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (!trimmed || !trimmed.startsWith('data: ')) continue;
                            const dataStr = trimmed.slice(6);
                            if (dataStr === '[DONE]') continue;
                            try {
                                const json = JSON.parse(dataStr);
                                const delta = json.choices?.[0]?.delta?.content;
                                if (delta) {
                                    fullContent += delta;
                                    bubbleEl.innerHTML = formatContent(fullContent);
                                    const lastMsg = messages[messages.length - 1];
                                    if (lastMsg && lastMsg.role === 'assistant') {
                                        lastMsg.content = fullContent;
                                    }
                                    scrollToBottom();
                                }
                            } catch (_) { /* ignore */ }
                        }
                    }

                    if (bubbleEl) {
                        const cursor = bubbleEl.querySelector('.typing-cursor');
                        if (cursor) cursor.remove();
                        const lastMsg = messages[messages.length - 1];
                        if (lastMsg && lastMsg.role === 'assistant') {
                            bubbleEl.innerHTML = formatContent(lastMsg.content);
                        }
                    }
                    saveHistory();

                } catch (error) {
                    if (statusEl.parentNode) statusEl.remove();
                    const allMsgs = chatArea.querySelectorAll('.message');
                    const lastMsgEl = allMsgs[allMsgs.length - 1];
                    if (lastMsgEl && lastMsgEl.classList.contains('assistant')) {
                        const bubble = lastMsgEl.querySelector('.message-bubble');
                        if (bubble && !bubble.textContent.trim()) {
                            lastMsgEl.remove();
                            if (messages.length > 0 && messages[messages.length - 1].role === 'assistant') {
                                messages.pop();
                            }
                        }
                    }
                    let errorMsg = error.message || 'An unknown error occurred during divination.';
                    if (error.name === 'AbortError') {
                        errorMsg = 'Divination was interrupted.';
                    }
                    addMessageToUI('assistant', `🌙 Dear seeker, ${errorMsg} Please try again.`);
                } finally {
                    setWaitingState(false);
                    abortController = null;
                    saveHistory();
                }
            }

            // ---------- Waiting state ----------
            function setWaitingState(waiting) {
                isWaiting = waiting;
                userInput.disabled = waiting;
                sendBtn.disabled = waiting;
                if (waiting) {
                    sendBtn.innerHTML = '<span>⏳</span> Sensing…';
                } else {
                    sendBtn.innerHTML = '<span>✨</span> Divine';
                }
                quickBtns.forEach(btn => btn.disabled = waiting);
            }

            // ---------- Clear chat ----------
            function clearChat() {
                if (isWaiting) return;
                if (messages.length === 0) return;
                if (confirm('Are you sure you want to clear all conversation history?')) {
                    messages = [];
                    localStorage.removeItem(HISTORY_KEY);
                    chatArea.innerHTML = '';
                    showWelcomeMessage();
                    scrollToBottom();
                }
            }

            // ---------- Abort ----------
            function abortRequest() {
                if (abortController) {
                    abortController.abort();
                    abortController = null;
                }
            }

            // ================================================================
            //  Event binding
            // ================================================================

            sendBtn.addEventListener('click', sendMessage);

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            userInput.addEventListener('input', () => {
                userInput.style.height = 'auto';
                userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
            });

            clearBtn.addEventListener('click', clearChat);

            settingsBtn.addEventListener('click', () => {
                if (isWaiting) return;
                apiKeyInput.value = apiKey;
                settingsModal.classList.add('active');
                apiKeyInput.focus();
            });

            modalSave.addEventListener('click', () => {
                const val = apiKeyInput.value.trim();
                if (val && val.length > 10) {
                    apiKey = val;
                    localStorage.setItem(STORAGE_KEY, apiKey);
                    updateApiStatus();
                    settingsModal.classList.remove('active');
                    if (isWaiting) {
                        abortRequest();
                        setWaitingState(false);
                    }
                } else {
                    alert('Please enter a valid DeepSeek API Key (should start with sk-).');
                    apiKeyInput.focus();
                }
            });

            modalCancel.addEventListener('click', () => {
                settingsModal.classList.remove('active');
            });

            settingsModal.addEventListener('click', (e) => {
                if (e.target === settingsModal) {
                    settingsModal.classList.remove('active');
                }
            });

            apiKeyInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    modalSave.click();
                }
            });

            quickBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (isWaiting) return;
                    const question = btn.dataset.question;
                    if (question) {
                        userInput.value = question;
                        userInput.style.height = 'auto';
                        userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
                        userInput.focus();
                        setTimeout(sendMessage, 300);
                    }
                });
            });

            window.addEventListener('beforeunload', () => {
                if (abortController) {
                    abortController.abort();
                }
            });

            init();

            userInput.addEventListener('focus', () => {
                setTimeout(scrollToBottom, 300);
            });

            console.log('🔮 Mystic Divination started ✦ May the stars guide you');
        })();
    </script>

</body>
</html>
